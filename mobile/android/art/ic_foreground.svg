<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- the photo wagon: a flat railway car with a wooden side rail, a curved wooden
       beam on top, red curtains hanging full height and parted on a camera lens -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d99a4e"/><stop offset="1" stop-color="#a86a2c"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a51c14"/><stop offset="0.45" stop-color="#e2463a"/><stop offset="1" stop-color="#a51c14"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#7a3a12"/><stop offset="0.6" stop-color="#2c1408"/><stop offset="1" stop-color="#150903"/></radialGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#7cc4ff"/><stop offset="0.45" stop-color="#1f5fd0"/><stop offset="1" stop-color="#0a1f5c"/></radialGradient>
  </defs>
  <!-- the dark inside, lit from behind the lens -->
  <rect x="26" y="32" width="56" height="32" fill="url(#glow)"/>
  <!-- lens hood and lens -->
  <path d="M47 38h14l-2 3.5H49Z" fill="#2a1a12"/>
  <circle cx="54" cy="49" r="9.5" fill="#15130f" stroke="#4a3320" stroke-width="1.2"/>
  <circle cx="54" cy="49" r="7.6" fill="#2a2a30"/>
  <circle cx="54" cy="49" r="6.4" fill="url(#glass)"/>
  <circle cx="56.5" cy="51.5" r="1.4" fill="#ffb347" opacity="0.9"/>
  <circle cx="55" cy="46.5" r="1.1" fill="#7dff7a" opacity="0.8"/>
  <circle cx="51.5" cy="46.5" r="1.6" fill="#ffffff" opacity="0.85"/>
  <!-- the curtains, parted and tied back -->
  <path d="M26 33H52.5Q51.5 40 46.5 45.5L39.5 48.5Q41.5 54 43 64H26Z" fill="url(#red)"/>
  <path d="M82 33H55.5Q56.5 40 61.5 45.5L68.5 48.5Q66.5 54 65 64H82Z" fill="url(#red)"/>
  <g stroke="#7f130d" stroke-width="0.9" fill="none" opacity="0.85">
    <path d="M32 33q1 10 1 31M38 33q3 8 2 13M45 33q2 6-1 11"/>
    <path d="M76 33q-1 10-1 31M70 33q-3 8-2 13M63 33q-2 6 1 11"/>
  </g>
  <g stroke="#f2c14e" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M37 48q4-2.5 8 0.5M71 48q-4-2.5-8 0.5"/>
  </g>
  <g fill="#f2c14e">
    <path d="M40.5 50.5v2.5l-1.6 3.5h3.2l-1.6-3.5" stroke="#f2c14e" stroke-width="0.9"/>
    <path d="M67.5 50.5v2.5l-1.6 3.5h3.2l-1.6-3.5" stroke="#f2c14e" stroke-width="0.9"/>
    <path d="M30 36v3l-1.5 3.5h3l-1.5-3.5" stroke="#f2c14e" stroke-width="0.9"/>
    <path d="M78 36v3l-1.5 3.5h3l-1.5-3.5" stroke="#f2c14e" stroke-width="0.9"/>
  </g>
  <!-- the curved beam on top -->
  <path d="M23 29Q54 20 85 29V36Q54 27 23 36Z" fill="url(#wood)" stroke="#3a2210" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M27 31.5Q54 23.5 81 31.5" fill="none" stroke="#f0c070" stroke-width="0.8" opacity="0.7"/>
  <circle cx="27.5" cy="32.5" r="1.3" fill="#9a9aa4"/><circle cx="80.5" cy="32.5" r="1.3" fill="#9a9aa4"/>
  <!-- the wooden side rail -->
  <rect x="22" y="62" width="64" height="12" fill="url(#wood)" stroke="#3a2210" stroke-width="1.4"/>
  <path d="M27 68h54M41 62.5v11M67 62.5v11" stroke="#6e4218" stroke-width="1"/>
  <rect x="22" y="60.5" width="5.5" height="14.5" rx="0.6" fill="#b5722e" stroke="#3a2210" stroke-width="1.2"/>
  <rect x="80.5" y="60.5" width="5.5" height="14.5" rx="0.6" fill="#b5722e" stroke="#3a2210" stroke-width="1.2"/>
  <g fill="#9a9aa4"><circle cx="24.8" cy="64" r="1.1"/><circle cx="24.8" cy="71" r="1.1"/><circle cx="83.2" cy="64" r="1.1"/><circle cx="83.2" cy="71" r="1.1"/></g>
  <!-- the chassis, buffers and steel wheels -->
  <rect x="19" y="74.5" width="70" height="2.6" rx="1.3" fill="#4a4a54"/>
  <rect x="26" y="74" width="56" height="4.5" fill="#33333b"/>
  <g stroke="#3a2210" stroke-width="1.2">
    <circle cx="38" cy="82" r="7.2" fill="#2c2c33"/><circle cx="38" cy="82" r="4.6" fill="#5a5a64" stroke="none"/>
    <path d="M38 77.6v8.8M33.6 82h8.8M34.9 78.9l6.2 6.2M41.1 78.9l-6.2 6.2" stroke="#2c2c33" stroke-width="1.2"/>
    <circle cx="38" cy="82" r="1.7" fill="#c49a52" stroke="none"/>
    <circle cx="70" cy="82" r="7.2" fill="#2c2c33"/><circle cx="70" cy="82" r="4.6" fill="#5a5a64" stroke="none"/>
    <path d="M70 77.6v8.8M65.6 82h8.8M66.9 78.9l6.2 6.2M73.1 78.9l-6.2 6.2" stroke="#2c2c33" stroke-width="1.2"/>
    <circle cx="70" cy="82" r="1.7" fill="#c49a52" stroke="none"/>
  </g>
</svg>
