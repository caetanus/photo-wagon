// ldc2 -conf=mobile/toolchain/ldc2-android.conf -mtriple=aarch64-linux-android ...
// Pinned to LDC 1.42 for Android: build with the bundled 1.42 host compiler
// (~/lab/android-d/ldc2-1.42.0-linux-x86_64, which build-android.sh selects) against the
// 1.42 prebuilt device runtime, linked through the NDK clang. Compiler and runtime MUST
// match: a newer host (1.43) generates druntime/phobos references (filterCaughtThrowable,
// mallinfo2) that the 1.42 runtime — and this Android 13 device's bionic — do not provide.
"default":
{
    switches ~= [ "-defaultlib=phobos2-ldc,druntime-ldc" ];
    post-switches ~= [ "-I/home/caetano/lab/android-d/ldc2-1.42.0-linux-x86_64/import" ];
    lib-dirs = [ "/usr/lib", "/usr/lib/llvm21/lib/clang/21/lib/x86_64-pc-linux-gnu" ];
    rpath = "/usr/lib";
};
"aarch64-.*-linux-android":
{
    switches ~= [
        "-link-defaultlib-shared=false",
        "-gcc=/opt/android-sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang",
        "-linker=lld",
    ];
    lib-dirs = [ "/home/caetano/lab/android-d/ldc2-1.42.0-android-aarch64/lib" ];
    rpath = "";
};

// The emulator: the runtime is not shipped by LDC; ldc-build-runtime makes it
// (see ANDROID.md, "The emulator"), installed under ~/lab/android-d.
"x86_64-.*-linux-android":
{
    switches ~= [
        "-link-defaultlib-shared=false",
        "-gcc=/opt/android-sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang",
        "-linker=lld",
    ];
    lib-dirs = [ "/home/caetano/lab/android-d/ldc2-1.42.0-android-x86_64/lib" ];
    rpath = "";
};
