<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- the photo wagon, sober: walnut, deep crimson, dark steel; no outlines, no ornament -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5c37"/><stop offset="1" stop-color="#5e3b22"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5c0f0f"/><stop offset="0.45" stop-color="#9c1f1c"/><stop offset="1" stop-color="#5c0f0f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#3a2416"/><stop offset="0.7" stop-color="#15100c"/><stop offset="1" stop-color="#0c0908"/></radialGradient>
    <radialGradient id="glass" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#4f86c8"/><stop offset="0.5" stop-color="#1c3f78"/><stop offset="1" stop-color="#0a1830"/></radialGradient>
  </defs>
  <!-- the dark inside -->
  <rect x="26" y="32" width="56" height="32" fill="url(#glow)"/>
  <!-- the lens -->
  <path d="M47.5 38.5h13l-1.6 3h-9.8Z" fill="#1a130e"/>
  <circle cx="54" cy="49" r="9.5" fill="#100d0a"/>
  <circle cx="54" cy="49" r="7.6" fill="#24242a"/>
  <circle cx="54" cy="49" r="6.3" fill="url(#glass)"/>
  <circle cx="51.6" cy="46.6" r="1.3" fill="#dbe8ff" opacity="0.75"/>
  <!-- the curtains, parted and tied back -->
  <path d="M26 33H52.5Q51.5 40 46.5 45.5L39.5 48.5Q41.5 54 43 64H26Z" fill="url(#red)"/>
  <path d="M82 33H55.5Q56.5 40 61.5 45.5L68.5 48.5Q66.5 54 65 64H82Z" fill="url(#red)"/>
  <g stroke="#3f0a0a" stroke-width="0.9" fill="none" opacity="0.7">
    <path d="M31 33q1 10 1 31M37 33q3 8 2 13M44 33q2 6-1 11"/>
    <path d="M77 33q-1 10-1 31M71 33q-3 8-2 13M64 33q-2 6 1 11"/>
  </g>
  <g stroke="#a88a4a" stroke-width="1.8" fill="none" stroke-linecap="round">
    <path d="M37 48q4-2.5 8 0.5M71 48q-4-2.5-8 0.5"/>
  </g>
  <!-- the curved beam -->
  <path d="M23 29Q54 20 85 29V36Q54 27 23 36Z" fill="url(#wood)"/>
  <path d="M23 36Q54 27 85 36" fill="none" stroke="#3a2415" stroke-width="1.2"/>
  <!-- the side rail -->
  <rect x="22" y="62" width="64" height="12" fill="url(#wood)"/>
  <path d="M22 68h64" stroke="#3a2415" stroke-width="0.9" opacity="0.9"/>
  <path d="M41 62v12M67 62v12" stroke="#3a2415" stroke-width="0.9" opacity="0.7"/>
  <rect x="22" y="60.5" width="5" height="14.5" fill="#6b4526"/>
  <rect x="81" y="60.5" width="5" height="14.5" fill="#6b4526"/>
  <!-- the chassis and wheels -->
  <rect x="19" y="74.5" width="70" height="2.4" rx="1.2" fill="#2e2e33"/>
  <rect x="26" y="74" width="56" height="4.5" fill="#1f1f24"/>
  <circle cx="38" cy="82" r="7" fill="#1c1c20"/><circle cx="38" cy="82" r="4.4" fill="#3d3d45"/><circle cx="38" cy="82" r="1.6" fill="#8a7448"/>
  <circle cx="70" cy="82" r="7" fill="#1c1c20"/><circle cx="70" cy="82" r="4.4" fill="#3d3d45"/><circle cx="70" cy="82" r="1.6" fill="#8a7448"/>
</svg>
