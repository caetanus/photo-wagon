// ldc2 -conf=mobile/toolchain/ldc2-android.conf -mtriple=aarch64-linux-android ...
// Host sections mirror /etc/ldc2.conf; the android section uses the prebuilt
// runtime from ldc2-1.42.0-android-aarch64 and links through the NDK clang.
"default":
{
    switches ~= [ "-defaultlib=phobos2-ldc,druntime-ldc" ];
    post-switches ~= [ "-I/usr/include/dlang/ldc" ];
    lib-dirs = [ "/usr/lib", "/usr/lib/llvm21/lib/clang/21/lib/x86_64-pc-linux-gnu" ];
    rpath = "/usr/lib";
};
"aarch64-.*-linux-android":
{
    switches ~= [
        "-link-defaultlib-shared=false",
        "-gcc=/opt/android-sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang",
        "-linker=lld",
    ];
    lib-dirs = [ "/home/caetano/lab/android-d/ldc2-1.42.0-android-aarch64/lib" ];
    rpath = "";
};
